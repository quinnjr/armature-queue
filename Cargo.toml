[package]
name = "armature-queue"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-queue"
homepage = "https://quinnjr.github.io/armature"
description = "Job queue and background processing for Armature"
keywords = ["queue", "jobs", "background", "redis"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Logging
armature-log = { version = "0" }

# Core dependencies
async-trait = "0.1"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }

# Redis for queue backend - uses armature-redis for DI integration
armature-redis = { version = "0" }
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"] }

# DI integration
armature-core = { version = "0" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
armature-testkit = { path = "../armature-testkit", features = ["containers"] }

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "queue"
harness = false
